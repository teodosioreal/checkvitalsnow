name: Buscar fotos dos produtos

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/product-images.json
      - scripts/product-images.mjs

permissions:
  contents: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - run: npm ci

      - name: Baixar fotos dos sites oficiais
        run: npm run images:products

      - name: Salvar no repositório
        run: |
          git add src/assets/products
          if git diff --cached --quiet; then
            echo "Nenhuma foto nova."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: add official product photos"
          git push
