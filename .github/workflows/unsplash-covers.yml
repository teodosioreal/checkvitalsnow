name: Buscar imagens do Unsplash

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  covers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Buscar capas no Unsplash
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: node scripts/unsplash-covers.mjs

      - name: Salvar no repositório
        run: |
          if git diff --quiet; then
            echo "Nenhuma imagem nova."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/articles .unsplash-preview
          git commit -m "chore: add Unsplash cover images to articles"
          git push
