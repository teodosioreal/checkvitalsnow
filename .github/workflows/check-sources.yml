name: Conferir links das fontes

on:
  workflow_dispatch:
  push:
    paths:
      - src/content/articles/**

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Conferir cada URL de fonte
        run: node scripts/check-sources.mjs
      - name: Resumo
        run: cat source-report.md >> "$GITHUB_STEP_SUMMARY"
